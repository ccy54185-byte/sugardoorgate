<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 唐门 SUGARDOOR</title>
<style>
:root {
  --ink: #0b0b0d;
  --ink-2: #141416;
  --ink-3: #1b1b1e;
  --paper: #f5f5f7;
  --gold: #c9a227;
  --gold-soft: #e4c866;
  --cinnabar: #a3272f;
  --jade: #3d5849;
  --muted: #86868b;
  --glass-bg: rgba(18, 18, 24, 0.6);
  --glass-border: rgba(255, 255, 255, 0.08);
  --radius: 20px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--ink);
  color: var(--paper);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* 背景动画 */
.ambient-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: -1;
  background: #000;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.3;
  animation: orbFloat 20s infinite alternate ease-in-out;
}

.orb-1 { width: 40vw; height: 40vw; background: radial-gradient(circle, #2a1a0a, transparent 70%); top: -10%; left: -10%; }
.orb-2 { width: 50vw; height: 50vw; background: radial-gradient(circle, #0a1a2a, transparent 70%); bottom: -20%; right: -10%; animation-delay: -5s; }

@keyframes orbFloat {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(5vw, 8vh) scale(1.1); }
}

/* 主容器 */
.auth-container {
  width: 100%;
  max-width: 420px;
  padding: 20px;
  position: relative;
  z-index: 1;
}

/* 卡片 */
.auth-card {
  background: var(--glass-bg);
  backdrop-filter: blur(40px) saturate(150%);
  -webkit-backdrop-filter: blur(40px) saturate(150%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 40px;
  box-shadow: 
    0 25px 50px -12px rgba(0, 0, 0, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

/* Logo */
.auth-logo {
  text-align: center;
  margin-bottom: 32px;
}

.auth-logo .seal {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, var(--gold), var(--gold-soft));
  border-radius: 16px;
  font-size: 28px;
  font-weight: 900;
  color: var(--ink);
  margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(201, 162, 39, 0.3);
}

.auth-logo h1 {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.auth-logo p {
  color: var(--muted);
  font-size: 14px;
  margin-top: 8px;
}

/* Tab切换 */
.auth-tabs {
  display: flex;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 28px;
}

.auth-tab {
  flex: 1;
  padding: 12px;
  text-align: center;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  border-radius: 10px;
  transition: all 0.3s ease;
}

.auth-tab.active {
  background: var(--gold);
  color: var(--ink);
  box-shadow: 0 4px 12px rgba(201, 162, 39, 0.3);
}

/* 表单 */
.auth-form {
  display: none;
}

.auth-form.active {
  display: block;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  color: var(--paper);
  font-size: 15px;
  transition: all 0.3s ease;
}

.form-input:focus {
  outline: none;
  border-color: var(--gold);
  background: rgba(201, 162, 39, 0.05);
  box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.1);
}

.form-input::placeholder {
  color: rgba(134, 134, 139, 0.6);
}

/* 头像上传 */
.avatar-upload {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
}

.avatar-preview {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.05);
  border: 2px dashed rgba(255, 255, 255, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s ease;
}

.avatar-preview:hover {
  border-color: var(--gold);
  background: rgba(201, 162, 39, 0.05);
}

.avatar-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.avatar-preview .placeholder {
  font-size: 32px;
  color: var(--muted);
}

.avatar-upload-text {
  flex: 1;
}

.avatar-upload-text p {
  font-size: 14px;
  color: var(--paper);
  margin-bottom: 4px;
}

.avatar-upload-text span {
  font-size: 12px;
  color: var(--muted);
}

/* 提交按钮 */
.submit-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--gold), var(--gold-soft));
  border: none;
  border-radius: 12px;
  color: var(--ink);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 8px;
}

.submit-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(201, 162, 39, 0.4);
}

.submit-btn:active {
  transform: translateY(0);
}

.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* 错误/成功消息 */
.message {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 20px;
  font-size: 14px;
  display: none;
}

.message.error {
  display: block;
  background: rgba(163, 39, 47, 0.2);
  border: 1px solid rgba(163, 39, 47, 0.3);
  color: #ff6b6b;
}

.message.success {
  display: block;
  background: rgba(61, 88, 73, 0.2);
  border: 1px solid rgba(61, 88, 73, 0.3);
  color: #6bffb8;
}

/* 返回链接 */
.back-link {
  text-align: center;
  margin-top: 20px;
}

.back-link a {
  color: var(--muted);
  font-size: 14px;
  text-decoration: none;
  transition: color 0.3s ease;
}

.back-link a:hover {
  color: var(--gold);
}

/* 用户信息卡片（登录后显示） */
.user-card {
  text-align: center;
  display: none;
}

.user-card.active {
  display: block;
}

.user-avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.05);
  border: 3px solid var(--gold);
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.user-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.user-avatar .placeholder {
  font-size: 40px;
  color: var(--muted);
}

.user-nickname {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: 8px;
}

.user-id {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 24px;
}

.logout-btn {
  padding: 12px 32px;
  background: rgba(163, 39, 47, 0.2);
  border: 1px solid rgba(163, 39, 47, 0.3);
  border-radius: 10px;
  color: #ff6b6b;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
}

.logout-btn:hover {
  background: rgba(163, 39, 47, 0.3);
}

/* 响应式 */
@media (max-width: 480px) {
  .auth-card {
    padding: 28px;
  }
  
  .auth-logo .seal {
    width: 56px;
    height: 56px;
    font-size: 24px;
  }
}
</style>
</head>
<body>

<div class="ambient-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<div class="auth-container">
  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="seal">唐</div>
      <h1>唐门 SUGARDOOR</h1>
      <p>以器载道，以门会友</p>
    </div>
    
    <!-- 登录后显示的用户卡片 -->
    <div class="user-card" id="userCard">
      <div class="user-avatar" id="userAvatar">
        <span class="placeholder">👤</span>
      </div>
      <div class="user-nickname" id="userNickname"></div>
      <div class="user-id" id="userId"></div>
      <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>
    
    <!-- 登录/注册表单 -->
    <div id="authForms">
      <!-- Tab切换 -->
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">登录</button>
        <button class="auth-tab" onclick="switchTab('register')">注册</button>
      </div>
      
      <!-- 消息提示 -->
      <div class="message" id="message"></div>
      
      <!-- 登录表单 -->
      <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>昵称</label>
          <input type="text" class="form-input" id="loginNickname" placeholder="请输入昵称" required>
        </div>
        
        <div class="form-group">
          <label>密码</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" required>
        </div>
        
        <button type="submit" class="submit-btn" id="loginBtn">登录</button>
      </form>
      
      <!-- 注册表单 -->
      <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
        <div class="avatar-upload">
          <div class="avatar-preview" onclick="document.getElementById('avatarInput').click()">
            <span class="placeholder" id="avatarPlaceholder">📷</span>
            <img id="avatarPreview" style="display: none;">
          </div>
          <div class="avatar-upload-text">
            <p>点击上传头像</p>
            <span>支持 JPG、PNG、GIF、WebP，最大 2MB</span>
          </div>
          <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="previewAvatar(this)">
        </div>
        
        <div class="form-group">
          <label>昵称</label>
          <input type="text" class="form-input" id="registerNickname" placeholder="2-20个字符" required minlength="2" maxlength="20">
        </div>
        
        <div class="form-group">
          <label>密码</label>
          <input type="password" class="form-input" id="registerPassword" placeholder="至少6个字符" required minlength="6">
        </div>
        
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" class="form-input" id="confirmPassword" placeholder="再次输入密码" required>
        </div>
        
        <button type="submit" class="submit-btn" id="registerBtn">注册</button>
      </form>
    </div>
    
    <!-- 返回链接 -->
    <div class="back-link">
      <a href="index.html">← 返回首页</a>
    </div>
  </div>
</div>

<script>
// 检查登录状态
const token = localStorage.getItem('token');
if (token) {
  checkLoginStatus();
}

// 切换Tab
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
  
  if (tab === 'login') {
    document.querySelector('.auth-tab:first-child').classList.add('active');
    document.getElementById('loginForm').classList.add('active');
  } else {
    document.querySelector('.auth-tab:last-child').classList.add('active');
    document.getElementById('registerForm').classList.add('active');
  }
  
  hideMessage();
}

// 显示消息
function showMessage(text, type) {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = 'message ' + type;
}

// 隐藏消息
function hideMessage() {
  document.getElementById('message').className = 'message';
}

// 预览头像
function previewAvatar(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('avatarPreview').src = e.target.result;
      document.getElementById('avatarPreview').style.display = 'block';
      document.getElementById('avatarPlaceholder').style.display = 'none';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

// 处理登录
async function handleLogin(e) {
  e.preventDefault();
  
  const nickname = document.getElementById('loginNickname').value.trim();
  const password = document.getElementById('loginPassword').value;
  
  if (!nickname || !password) {
    showMessage('请填写所有字段', 'error');
    return;
  }
  
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = '登录中...';
  
  try {
    const response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nickname, password })
    });
    
    const data = await response.json();
    
    if (data.success) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      showMessage('登录成功！', 'success');
      setTimeout(() => {
        showUserCard(data.user);
      }, 500);
    } else {
      showMessage(data.error || '登录失败', 'error');
    }
  } catch (error) {
    showMessage('网络错误，请重试', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '登录';
  }
}

// 处理注册
async function handleRegister(e) {
  e.preventDefault();
  
  const nickname = document.getElementById('registerNickname').value.trim();
  const password = document.getElementById('registerPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const avatarInput = document.getElementById('avatarInput');
  
  if (!nickname || !password) {
    showMessage('请填写所有字段', 'error');
    return;
  }
  
  if (password !== confirmPassword) {
    showMessage('两次密码输入不一致', 'error');
    return;
  }
  
  if (password.length < 6) {
    showMessage('密码长度至少6个字符', 'error');
    return;
  }
  
  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.textContent = '注册中...';
  
  try {
    // 先上传头像（如果有）
    let avatarUrl = '';
    if (avatarInput.files && avatarInput.files[0]) {
      const formData = new FormData();
      formData.append('avatar', avatarInput.files[0]);
      
      // 先注册获取token
      const registerResponse = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nickname, password, avatar_url: '' })
      });
      
      const registerData = await registerResponse.json();
      
      if (!registerData.success) {
        showMessage(registerData.error || '注册失败', 'error');
        return;
      }
      
      // 上传头像
      const avatarResponse = await fetch('/api/auth/avatar', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + registerData.token },
        body: formData
      });
      
      const avatarData = await avatarResponse.json();
      
      if (avatarData.success) {
        avatarUrl = avatarData.avatar_url;
        registerData.user.avatar_url = avatarUrl;
      }
      
      localStorage.setItem('token', registerData.token);
      localStorage.setItem('user', JSON.stringify(registerData.user));
      showMessage('注册成功！', 'success');
      
      setTimeout(() => {
        showUserCard(registerData.user);
      }, 500);
      
      return;
    }
    
    // 没有头像，直接注册
    const response = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nickname, password, avatar_url: avatarUrl })
    });
    
    const data = await response.json();
    
    if (data.success) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      showMessage('注册成功！', 'success');
      setTimeout(() => {
        showUserCard(data.user);
      }, 500);
    } else {
      showMessage(data.error || '注册失败', 'error');
    }
  } catch (error) {
    showMessage('网络错误，请重试', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '注册';
  }
}

// 显示用户卡片
function showUserCard(user) {
  document.getElementById('authForms').style.display = 'none';
  document.getElementById('userCard').classList.add('active');
  
  document.getElementById('userNickname').textContent = user.nickname;
  document.getElementById('userId').textContent = 'ID: ' + user.id;
  
  if (user.avatar_url) {
    const avatarEl = document.getElementById('userAvatar');
    avatarEl.textContent = '';
    const img = document.createElement('img');
    img.src = user.avatar_url;
    img.alt = '头像';
    avatarEl.appendChild(img);
  }
}

// 检查登录状态
async function checkLoginStatus() {
  try {
    const response = await fetch('/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    
    const data = await response.json();
    
    if (data.success) {
      showUserCard(data.user);
    } else {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
    }
  } catch (error) {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
  }
}

// 退出登录
async function logout() {
  try {
    await fetch('/api/auth/logout', { method: 'POST' });
  } catch (error) {
    // 忽略错误
  }
  
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  
  document.getElementById('userCard').classList.remove('active');
  document.getElementById('authForms').style.display = 'block';
  
  // 清空表单
  document.getElementById('loginForm').reset();
  document.getElementById('registerForm').reset();
  document.getElementById('avatarPreview').style.display = 'none';
  document.getElementById('avatarPlaceholder').style.display = 'block';
  
  switchTab('login');
  showMessage('已退出登录', 'success');
}
</script>

</body>
</html>
