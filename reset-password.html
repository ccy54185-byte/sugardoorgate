<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重置密码 - 唐门 SUGARDOOR</title>
<style>
:root {
  --ink: #0b0b0d;
  --ink-2: #141416;
  --paper: #f5f5f7;
  --gold: #c9a227;
  --gold-soft: #e4c866;
  --cinnabar: #a3272f;
  --muted: #86868b;
  --glass-bg: rgba(18, 18, 24, 0.6);
  --glass-border: rgba(255, 255, 255, 0.08);
  --radius: 20px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--ink);
  color: var(--paper);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.ambient-bg {
  position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: -1; background: #000;
}
.orb {
  position: absolute; border-radius: 50%;
  filter: blur(120px); opacity: 0.3;
  animation: orbFloat 20s infinite alternate ease-in-out;
}
.orb-1 { width: 40vw; height: 40vw; background: radial-gradient(circle, #2a1a0a, transparent 70%); top: -10%; left: -10%; }
.orb-2 { width: 50vw; height: 50vw; background: radial-gradient(circle, #0a1a2a, transparent 70%); bottom: -20%; right: -10%; animation-delay: -5s; }
@keyframes orbFloat {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(5vw, 8vh) scale(1.1); }
}
.auth-container {
  width: 100%; max-width: 420px; padding: 20px;
  position: relative; z-index: 1;
}
.auth-card {
  background: var(--glass-bg);
  backdrop-filter: blur(40px) saturate(150%);
  -webkit-backdrop-filter: blur(40px) saturate(150%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 40px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
.auth-logo {
  text-align: center; margin-bottom: 32px;
}
.auth-logo .seal {
  display: inline-flex; align-items: center; justify-content: center;
  width: 64px; height: 64px;
  background: linear-gradient(135deg, var(--gold), var(--gold-soft));
  border-radius: 16px; font-size: 28px; font-weight: 900; color: var(--ink);
  margin-bottom: 16px; box-shadow: 0 8px 24px rgba(201, 162, 39, 0.3);
}
.auth-logo h1 { font-size: 24px; font-weight: 600; letter-spacing: 0.5px; }
.auth-logo p { color: var(--muted); font-size: 14px; margin-top: 8px; }
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-size: 13px; font-weight: 500;
  color: var(--muted); margin-bottom: 8px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.form-input {
  width: 100%; padding: 14px 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px; color: var(--paper);
  font-size: 15px; transition: all 0.3s ease;
}
.form-input:focus {
  outline: none; border-color: var(--gold);
  background: rgba(201, 162, 39, 0.05);
  box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.1);
}
.form-input::placeholder { color: rgba(134, 134, 139, 0.6); }
.submit-btn {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, var(--gold), var(--gold-soft));
  border: none; border-radius: 12px;
  color: var(--ink); font-size: 16px; font-weight: 600;
  cursor: pointer; transition: all 0.3s ease; margin-top: 8px;
}
.submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201, 162, 39, 0.3); }
.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.message {
  padding: 12px 16px; border-radius: 10px;
  margin-bottom: 20px; font-size: 14px; display: none;
}
.message.error {
  display: block; background: rgba(163, 39, 47, 0.2);
  border: 1px solid rgba(163, 39, 47, 0.3); color: #ff6b6b;
}
.message.success {
  display: block; background: rgba(61, 88, 73, 0.2);
  border: 1px solid rgba(61, 88, 73, 0.3); color: #6bffb8;
}
.back-link { text-align: center; margin-top: 20px; }
.back-link a { color: var(--muted); font-size: 14px; text-decoration: none; transition: color 0.3s; }
.back-link a:hover { color: var(--gold); }
</style>
</head>
<body>
<div class="ambient-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="seal">唐</div>
      <h1>重置密码</h1>
      <p>设置您的新密码</p>
    </div>
    <div class="message" id="message"></div>
    <form id="resetForm" onsubmit="handleReset(event)">
      <div class="form-group">
        <label>新密码</label>
        <input type="password" class="form-input" id="newPassword" placeholder="至少6个字符" required minlength="6">
      </div>
      <div class="form-group">
        <label>确认新密码</label>
        <input type="password" class="form-input" id="confirmPassword" placeholder="再次输入新密码" required>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">重置密码</button>
    </form>
    <div class="back-link">
      <a href="login.html">← 返回登录</a>
    </div>
  </div>
</div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (!token) {
  document.getElementById('message').textContent = '无效的重置链接';
  document.getElementById('message').className = 'message error';
  document.getElementById('resetForm').style.display = 'none';
}

function showMessage(text, type) {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = 'message ' + type;
}

async function handleReset(e) {
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (newPassword !== confirmPassword) {
    showMessage('两次密码输入不一致', 'error');
    return;
  }
  if (newPassword.length < 6) {
    showMessage('密码长度至少6个字符', 'error');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '重置中...';

  try {
    const response = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: newPassword })
    });
    const data = await response.json();
    if (data.success) {
      showMessage('密码重置成功！即将跳转到登录页面...', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    } else {
      showMessage(data.error || '重置失败', 'error');
      btn.disabled = false;
      btn.textContent = '重置密码';
    }
  } catch (error) {
    showMessage('网络错误，请重试', 'error');
    btn.disabled = false;
    btn.textContent = '重置密码';
  }
}
</script>
</body>
</html>
